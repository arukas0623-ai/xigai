<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>析概 · 知识图书馆</title>
<meta name="description" content="析概——一座会思考的图书馆：多领域概念解析，全网搜索 + AI 分析，模糊搜索，主题换肤。">
<link rel="icon" type="image/svg+xml" href="assets/img/logo.svg">
<link rel="stylesheet" href="assets/css/themes.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/library.css">
<link rel="stylesheet" href="assets/css/detail.css">
<link rel="stylesheet" href="assets/css/ui-refine.css">
</head>
<body data-theme="gold">

<div id="scene">
  <div class="moon"></div>
  <div class="vignette"></div>
</div>

<header id="topbar">
  <div class="brand">
    <img class="logo" src="assets/img/logo.svg" alt="析概" title="析概">
    <div class="brand-text"><h1>析概</h1><small>知识图书馆 · KNOWLEDGE LIBRARY</small></div>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" placeholder="模糊搜索：概念 / 别名 / 标签 / 拼音（如 tlj）…" autocomplete="off" spellcheck="false">
      <button id="search-clear" title="清空">✕</button>
    </div>
    <div id="search-results"></div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btn-view" title="书架视图切换 (V)"><span>视图</span></button>
    <button class="icon-btn" id="btn-personal" title="我的学习中心"><span>我的</span></button>
    <button class="icon-btn" id="btn-theme" title="主题换肤 (T)"><span>主题</span></button>
    <button class="icon-btn" id="btn-fav" title="我的收藏 (F)"><span>收藏</span><span class="badge hidden" id="fav-badge">0</span></button>
    <button class="icon-btn" id="btn-hist" title="阅读历史"><span>历史</span></button>
  </div>
</header>

<main id="library">
  <div id="welcome">
    <div class="wl-title">析 概</div>
    <div class="wl-sub">每个概念，都被全网检索与 AI 解读 — 概念、关系、体系，自成长的知识网络</div>
    <div class="wl-stats" id="wl-stats"></div>
    <div id="daily-term" class="wl-stats" style="margin-top:16px;font-size:13.5px;color:var(--ink-2)"></div>
  </div>
  <div class="domains-rail" id="domains-rail"></div>
  <div id="shelves"></div>
  <div class="empty-tip" id="loading-tip" style="display:none">正在整理书架，请稍候…</div>
</main>

<div id="quickbar">
  <button class="quick-btn" id="btn-random" title="随机开书 (R)">🎲<span class="tip">随机翻开一本书</span></button>
  <button class="quick-btn" id="btn-daily" title="今日藏书">📖<span class="tip">今日推荐藏书</span></button>
  <button class="quick-btn" id="btn-trash" title="把书拖到这里藏起">🗑<span class="tip">把书拖到这里藏起（点击查看数量）</span></button>
  <button class="quick-btn chat-float" id="btn-chat" title="问 AI 解析">💬<span class="tip">问 AI 解析：任意概念/术语/黑话</span></button>
</div>

<!-- AI 解析员聊天抽屉 -->
<div id="chat-drawer" class="hidden">
  <div class="chat-head">
    <span class="chat-title">🤖 AI 解析员 <small>联网 · 深度解析</small></span>
    <span class="chat-tools">
      <button id="chat-clear" title="清空对话">🗑</button>
      <button id="chat-close" title="关闭">✕</button>
    </span>
  </div>
  <div class="chat-body" id="chat-body"></div>
  <div class="chat-sugg" id="chat-sugg"></div>
  <div class="chat-input-row">
    <textarea id="chat-input" rows="1" placeholder="输入任意概念 / 术语 / 黑话，如：什么是 CLI？回车发送"></textarea>
    <button id="chat-send" title="发送 (Enter)">➤</button>
  </div>
</div>

<footer id="footer">
  析概 · 知识图书馆 — 概念解析数据由 <b>全网搜索 + AI 分析</b> 生成 · 支持模糊搜索 / 主题换肤 / 收藏 / 阅读历史<br>
  快捷键：/ 搜索 · ← → 上一本/下一本 · R 随机 · F 收藏 · T 主题 · V 视图 · Esc 关闭
</footer>

<div id="read-progress"></div>

<div id="detail" class="overlay hidden"></div>
<div id="side-panel" class="overlay hidden"></div>
<div id="theme-panel" class="overlay hidden"></div>

<script src="vendor/pinyin-pro.js"></script>
<script src="data/manifest.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/kgraph.js"></script>
<script src="assets/js/personal.js"></script>
<script src="assets/js/chat.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
